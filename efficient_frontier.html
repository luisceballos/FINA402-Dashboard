<style>
.ef-bar {
  display:flex; gap:10px; align-items:center;
  padding:8px 18px 6px 18px;
  background:#F0F4FA; border-bottom:1px solid #D8E2EE;
  font-family:Arial,sans-serif;
}
.ef-label { font-size:12px; font-weight:700; color:#3A5278; margin-right:2px; }
.ef-btn {
  padding:5px 18px; border-radius:5px; border:1.5px solid #93C5FD;
  background:#EEF2F8; color:#0F2540; font-size:11px;
  font-weight:700; cursor:pointer; transition:background 0.15s,color 0.15s;
  font-family:Arial,sans-serif;
}
.ef-btn.on  { background:#0052CC; color:#fff; border-color:#0052CC; }
.ef-btn.on:hover { background:#003EA8; }
.ef-btn:not(.on):hover { background:#DBEAFE; }
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var gd = document.querySelector('.plotly-graph-div');

  // Insert toggle bar before the plot
  var bar = document.createElement('div');
  bar.className = 'ef-bar';
  bar.innerHTML =
    '<span class="ef-label">TOGGLE:</span>' +
    '<button class="ef-btn on" id="ef-cml">CML + Tangency</button>' +
    '<button class="ef-btn on" id="ef-lev">Leveraged ETFs</button>';
  gd.parentNode.insertBefore(bar, gd);

  var cmlOn = true, levOn = true;
  var CML_IDX = [2, 3, 22];
  var LEV_IDX = [4, 5, 6, 7, 8];

  document.getElementById('ef-cml').addEventListener('click', function() {
    cmlOn = !cmlOn;
    Plotly.restyle(gd, {visible: cmlOn}, CML_IDX);
    this.classList.toggle('on', cmlOn);
  });

  document.getElementById('ef-lev').addEventListener('click', function() {
    levOn = !levOn;
    Plotly.restyle(gd, {visible: levOn}, LEV_IDX);
    this.classList.toggle('on', levOn);
  });
});
</script>
